name: 'Argus battery'
# Marketplace metadata: description must stay under 125 characters.
# Full conclusion mapping (PASS → success, UNKNOWN → neutral, FAIL →
# failure, billing/rig/contract violations → action_required) and exit
# codes live in README.md and in docs/ci/result-contract-v0.md +
# docs/ci/api-contract-v0.md of the lab repo.
description: >-
  Runs the Argus x402 battery against this commit and records the verdict as
  a check run.

inputs:
  api-key:
    description: 'Argus console api-key — pass ${{ secrets.ARGUS_API_KEY }}, never inline'
    required: true
  battery-id:
    description: 'Battery to run'
    required: false
    default: 'x402-core'
  console-url:
    description: 'Argus console base URL'
    required: false
    default: 'https://console.argus-lab.tech'

runs:
  using: composite
  steps:
    - id: argus
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_BATTERY_ID: ${{ inputs.battery-id }}
        INPUT_CONSOLE_URL: ${{ inputs.console-url }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"

branding:
  icon: 'shield'
  color: 'blue'
