name: latest-seal

# CI-as-verification (ТЗ п.4):
#   every push to main re-verifies the attestation registry — Ed25519
#   signatures, hash chain, evidence hashes. A tampered / broken seal turns
#   this job red, publicly, on the repo's Actions tab. The registry can
#   never silently drift from what the site claims.
#
# Same job also regenerates site/public/og-cover.png from the VERIFIED
# registry (ТЗ п.3) so the cover's "chain head / N records" footer can
# never drift from attestations/records. If the cover changed, it is
# committed back with [skip ci]; Vercel then redeploys with fresh art.
#
# CI-as-distribution: after verification succeeds, the job pings IndexNow
# (Bing/Yandex/Seznam push-indexing) so search engines learn about fresh
# evidence immediately instead of waiting for a crawl. The IndexNow key is
# PUBLIC by design — it is served at https://argus-lab.tech/<key>.txt;
# that file is what proves URL-list ownership, so no secret is needed here.
#
# CI-as-delivery: after verification succeeds, the job triggers a Vercel
# production deploy of the current main head via a Deploy Hook secret
# (VERCEL_DEPLOY_HOOK_URL). This is the delivery path of record — it does
# not depend on the Vercel GitHub App staying healthy, and it also fires
# on manual workflow_dispatch, so a missed rollout can be re-triggered
# from the Actions tab without a new commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-seal
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify registry (signatures + hash chain + evidence hashes)
        run: |
          node tools/registry/verify-registry.mjs | tee /tmp/verify-out.txt
          grep -q "registry intact" /tmp/verify-out.txt || {
            echo "::error::verifier exited 0 but did not claim 'registry intact'";
            exit 1;
          }
          grep -oE "registry intact.*" /tmp/verify-out.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate OG cover from verified registry
        run: |
          cd site
          npm install sharp --no-save --no-audit --no-fund
          node scripts/gen-og-cover.mjs

      - name: Commit regenerated cover (if changed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "argus-ci"
          git config user.email "argus.testlab@gmail.com"
          if git diff --quiet -- site/public/og-cover.png; then
            echo "og-cover.png already in sync with the registry"
          else
            git add site/public/og-cover.png
            git commit -m "ci(latest-seal): regenerate og-cover from verified registry [skip ci]"
            git push
          fi

      - name: Notify IndexNow (push-indexing for Bing/Yandex/Seznam)
        if: github.event_name != 'pull_request'
        run: |
          code=$(curl -s -o /tmp/innow.txt -w '%{http_code}' --max-time 30 \
            "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fargus-lab.tech%2F&key=9caa96c02417879834347edd5f4a571a&keyLocation=https%3A%2F%2Fargus-lab.tech%2F9caa96c02417879834347edd5f4a571a.txt" \
          ) || code="curl-failed"
          echo "IndexNow responded: $code" | tee -a "$GITHUB_STEP_SUMMARY"
          # Distribution is best-effort: a hiccup here must never redden the
          # verification contract above.
          exit 0

      - name: Trigger Vercel production deploy (deploy hook)
        if: github.event_name != 'pull_request'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "Vercel deploy hook: VERCEL_DEPLOY_HOOK_URL secret not set — skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -s -o /tmp/vhook.txt -w '%{http_code}' --max-time 30 -X POST "$HOOK_URL") || code="curl-failed"
          echo "Vercel deploy hook responded: $code" | tee -a "$GITHUB_STEP_SUMMARY"
          # Delivery is best-effort too: the deploy hook URL is a secret and
          # a hiccup here must never redden the verification contract above.
          exit 0
